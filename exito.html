  <h1>¡Gracias por tu compra!</h1>
  <p>Tu pago fue aprobado. Estamos preparando tu pedido y nos pondremos en contacto contigo para coordinar la entrega o el retiro en local.</p>

<script defer src="lib/manifest.js?v=20260760"></script>
<script defer>
  (function () {
    function ready(fn) { document.readyState !== "loading" ? fn() : document.addEventListener("DOMContentLoaded", fn); }
    ready(function () {
      // Meta Pixel: Purchase. Se lee el carrito ANTES de vaciarlo para saber
      // qué se compró. El payment_id de MercadoPago se usa como event_id:
      // así, cuando más adelante se agregue la API de Conversiones del lado
      // del servidor (mismo evento disparado desde el webhook de pago), Meta
      // puede reconocer que es el mismo evento y no contarlo dos veces.
      try {
        var rawCart = localStorage.getItem("bs_cart");
        var cart = rawCart ? JSON.parse(rawCart) : [];
        // La condición "cart.length" es lo que evita que el evento de
        // Compra se dispare dos veces si el cliente recarga esta página:
        // el carrito se vacía justo debajo, así que en la recarga
        // cart.length ya es 0 y ni Meta ni Google reciben un segundo
        // evento para la misma compra.
        if (cart.length) {
          var params = new URLSearchParams(window.location.search);
          var eventId = params.get("payment_id") || params.get("collection_id") || undefined;
          var value = cart.reduce(function (sum, it) { return sum + (Number(it.price) || 0) * (Number(it.qty) || 0); }, 0);

          if (window.fbq) {
            window.fbq("track", "Purchase", {
              content_ids: cart.map(function (it) { return it.id; }),
              contents: cart.map(function (it) { return { id: it.id, quantity: it.qty }; }),
              num_items: cart.reduce(function (sum, it) { return sum + (Number(it.qty) || 0); }, 0),
              value: value,
              currency: "CLP",
            }, eventId ? { eventID: eventId } : undefined);
          }

          if (window.BSAnalytics) {
            // Conversiones mejoradas: se pasa el email/teléfono ANTES del
            // evento de conversión para que Google lo asocie a esa compra.
            try {
              var rawEc = localStorage.getItem("bs_ec_data");
              var ec = rawEc ? JSON.parse(rawEc) : null;
              if (ec) window.BSAnalytics.setEnhancedConversionData(ec.email, ec.telefono);
            } catch (e2) { /* sin datos de contacto: la conversión igual se manda, solo sin mejora */ }

            // Un solo push al dataLayer. La conversión de Ads "Compra" ya
            // está resuelta por separado, importada directo desde GA4 (se
            // configuró así en Ads: Conversiones → Compra → sugerencia
            // automática del evento "purchase") — no hace falta (ni
            // conviene) además reportarla acá con gtag('event','conversion',
            // ...), porque duplicaría la conversión en vez de sumar datos.
            window.BSAnalytics.pushEcommerce("purchase", {
              transaction_id: eventId || "sin-referencia-" + Date.now(),
              currency: "CLP",
              value: value,
              items: cart.map(function (it) { return { item_id: it.id, item_name: it.name, price: it.price, quantity: it.qty }; }),
            });
          }
        }
      } catch (e) { /* privacy mode o carrito corrupto: no bloqueamos la página por esto */ }

      // El pago fue exitoso: vaciamos el carrito y los datos temporales de
      // contacto guardados localmente.
      try { localStorage.removeItem("bs_cart"); } catch (e) { /* privacy mode: ignore */ }
      try { localStorage.removeItem("bs_ec_data"); } catch (e) { /* privacy mode: ignore */ }

      // Vincular WhatsApp igual que en el resto del sitio (usa window.__BRAND__ de manifest.js).
      var data = window.__BRAND__;
      if (data) {
        var waBase = "https://wa.me/" + data.whatsappNumber + "?text=" + encodeURIComponent("Hola Bendita Suerte, acabo de realizar una compra online 🍀");
        document.querySelectorAll('[data-bind-href="whatsapp"]').forEach(function (el) { el.setAttribute("href", waBase); });
      }

      // Mostrar el ID de pago de MercadoPago si viene en la URL (referencia para el cliente).
      var params = new URLSearchParams(window.location.search);
      var paymentId = params.get("payment_id") || params.get("collection_id");
      var refEl = document.querySelector("[data-payment-ref]");
      if (refEl && paymentId) { refEl.textContent = "N° de operación MercadoPago: " + paymentId; }
    });
  })();
</script>
